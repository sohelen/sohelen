<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과일 부수기 게임 (Fruit Slasher)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Pretendard', 'Arial', sans-serif;
            background: linear-gradient(135deg, #2c3e50, #111);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 게임 컨테이너 */
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: radial-gradient(circle, #34495e 0%, #1a252f 100%);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 20px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            border: 4px solid #455a64;
        }

        /* 게임 캔버스 */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        /* UI 레이어 */
        .ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }

        .score-board {
            color: #f1c40f;
        }

        .timer-board {
            color: #e74c3c;
        }

        /* 오버레이 (시작/게임오버 화면) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            backdrop-filter: blur(5px);
        }

        .title {
            font-size: 48px;
            font-weight: 900;
            color: #ff7675;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 118, 117, 0.6);
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 18px;
            color: #dfe6e9;
            margin-bottom: 30px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(45deg, #ff7675, #d63031);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(214, 48, 49, 0.4);
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 20px rgba(214, 48, 49, 0.6);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .final-score {
            font-size: 32px;
            color: #ffeaa7;
            margin-bottom: 25px;
        }

        /* 안내 가이드 */
        .guide {
            margin-top: 15px;
            color: #b2bec3;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 상단 UI -->
        <div class="ui-layer">
            <div class="score-board">점수: <span id="score">0</span></div>
            <div class="timer-board">시간: <span id="timer">60</span>s</div>
        </div>

        <!-- 게임 화면 캔버스 -->
        <canvas id="gameCanvas"></canvas>

        <!-- 시작 화면 -->
        <div id="start-screen" class="overlay">
            <h1 class="title">🍉 과일 부수기! 🍌</h1>
            <p class="subtitle">마우스나 손가락으로 과일을 베어버리세요!</p>
            <p class="guide">⚠️ 폭탄(💣)을 마우스로 건드리면 즉시 게임 오버!</p>
            <br>
            <button class="btn" onclick="startGame()">게임 시작</button>
        </div>

        <!-- 게임 오버 화면 -->
        <div id="gameover-screen" class="overlay" style="display: none;">
            <h1 class="title" style="color: #e74c3c;">GAME OVER</h1>
            <div class="final-score">최종 점수: <span id="final-score-val">0</span>점</div>
            <button class="btn" onclick="startGame()">다시 하기</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 캔버스 크기 고정
        canvas.width = 800;
        canvas.height = 600;

        // 게임 상태 변수
        let isPlaying = false;
        let score = 0;
        let timeLeft = 60;
        let timerInterval = null;
        let spawnInterval = null;

        // 객체 배열
        let fruits = [];
        let particles = [];
        let sliceTrail = []; // 검기(칼날 궤적)

        // 마우스/터치 상태
        let isMouseDown = false;
        let mousePos = { x: 0, y: 0 };

        // 과일 종류 및 데이터
        const FRUIT_TYPES = [
            { name: '사과', emoji: '🍎', radius: 35, color: '#ff4d4d', points: 10 },
            { name: '바나나', emoji: '🍌', radius: 35, color: '#ffeaa7', points: 15 },
            { name: '수박', emoji: '🍉', radius: 45, color: '#2ed573', points: 20 },
            { name: '오렌지', emoji: '🍊', radius: 35, color: '#ffa502', points: 10 },
            { name: '포도', emoji: '🍇', radius: 35, color: '#a29bfe', points: 15 },
            { name: '폭탄', emoji: '💣', radius: 35, color: '#2f3542', points: 0, isBomb: true }
        ];

        // 웹 오디오 API 효과음 생성
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'slice') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'bomb') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            }
        }

        // 과일 클래스
        class Fruit {
            constructor() {
                // 무작위 과일 지정 (폭탄 등장 확률 15%)
                const isBomb = Math.random() < 0.15;
                if (isBomb) {
                    this.type = FRUIT_TYPES.find(f => f.isBomb);
                } else {
                    const normalFruits = FRUIT_TYPES.filter(f => !f.isBomb);
                    this.type = normalFruits[Math.floor(Math.random() * normalFruits.length)];
                }

                this.x = Math.random() * (canvas.width - 100) + 50;
                this.y = canvas.height + 50;
                this.radius = this.type.radius;
                
                // 속도 및 중력 계산 (위로 쏘아 올리기)
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = -(Math.random() * 4 + 13);
                this.gravity = 0.25;

                this.rotation = Math.random() * Math.PI * 2;
                this.vRot = (Math.random() - 0.5) * 0.1;

                this.sliced = false;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.rotation += this.vRot;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.font = `${this.radius * 1.8}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.type.emoji, 0, 0);
                ctx.restore();
            }
        }

        // 파티클 클래스 (과일 쪼개짐 및 즙 효과)
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 6 + 3;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.gravity = 0.3;
                this.alpha = 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.alpha -= 0.02;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // 게임 시작
        function startGame() {
            score = 0;
            timeLeft = 60;
            fruits = [];
            particles = [];
            sliceTrail = [];
            isPlaying = true;

            document.getElementById('score').innerText = score;
            document.getElementById('timer').innerText = timeLeft;
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('gameover-screen').style.display = 'none';

            // 타이머 설정
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // 과일 생성 루프
            clearInterval(spawnInterval);
            spawnInterval = setInterval(() => {
                if (isPlaying) {
                    const spawnCount = Math.floor(Math.random() * 2) + 1;
                    for (let i = 0; i < spawnCount; i++) {
                        fruits.push(new Fruit());
                    }
                }
            }, 1200);

            requestAnimationFrame(gameLoop);
        }

        // 게임 종료
        function endGame() {
            isPlaying = false;
            clearInterval(timerInterval);
            clearInterval(spawnInterval);

            document.getElementById('final-score-val').innerText = score;
            document.getElementById('gameover-screen').style.display = 'flex';
        }

        // 선분과 점(과일)의 충돌 검사 함수
        function checkSlice(p1, p2, fruit) {
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const len = Math.hypot(dx, dy);
            if (len === 0) return false;

            const u = ((fruit.x - p1.x) * dx + (fruit.y - p1.y) * dy) / (len * len);
            const clampedU = Math.max(0, Math.min(1, u));

            const nearestX = p1.x + clampedU * dx;
            const nearestY = p1.y + clampedU * dy;

            const dist = Math.hypot(fruit.x - nearestX, fruit.y - nearestY);
            return dist < fruit.radius;
        }

        // 게임 루프
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 칼날 궤적 그리기
            if (sliceTrail.length > 1) {
                ctx.beginPath();
                ctx.moveTo(sliceTrail[0].x, sliceTrail[0].y);
                for (let i = 1; i < sliceTrail.length; i++) {
                    ctx.lineTo(sliceTrail[i].x, sliceTrail[i].y);
                }
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00d2d3';
                ctx.stroke();
                ctx.shadowBlur = 0; // 초기화

                // 궤적 오래된 점 제거
                sliceTrail.shift();
            }

            // 2. 과일 업데이트 및 그리기
            for (let i = fruits.length - 1; i >= 0; i--) {
                const f = fruits[i];
                f.update();
                f.draw();

                // 궤적과 충돌 체크
                if (sliceTrail.length >= 2 && !f.sliced) {
                    const p1 = sliceTrail[sliceTrail.length - 2];
                    const p2 = sliceTrail[sliceTrail.length - 1];

                    if (checkSlice(p1, p2, f)) {
                        f.sliced = true;

                        if (f.type.isBomb) {
                            // 폭탄 처리
                            playSound('bomb');
                            endGame();
                            return;
                        } else {
                            // 일반 과일 쪼개기
                            playSound('slice');
                            score += f.type.points;
                            document.getElementById('score').innerText = score;

                            // 파티클 생성을 통한 과일 즙 효과
                            for (let p = 0; p < 15; p++) {
                                particles.push(new Particle(f.x, f.y, f.type.color));
                            }

                            fruits.splice(i, 1);
                            continue;
                        }
                    }
                }

                // 화면 아래로 떨어진 과일 제거
                if (f.y > canvas.height + 100) {
                    fruits.splice(i, 1);
                }
            }

            // 3. 파티클 업데이트 및 그리기
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            if (isPlaying) {
                requestAnimationFrame(gameLoop);
            }
        }

        // 입력 이벤트 수집
        function handleMove(x, y) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = x - rect.left;
            const mouseY = y - rect.top;

            if (isMouseDown) {
                sliceTrail.push({ x: mouseX, y: mouseY });
                if (sliceTrail.length > 8) sliceTrail.shift();
            }
        }

        // 마우스 이벤트
        canvas.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            sliceTrail = [];
            handleMove(e.clientX, e.clientY);
        });

        canvas.addEventListener('mousemove', (e) => {
            handleMove(e.clientX, e.clientY);
        });

        window.addEventListener('mouseup', () => {
            isMouseDown = false;
        });

        // 터치 이벤트 (모바일 지원)
        canvas.addEventListener('touchstart', (e) => {
            isMouseDown = true;
            sliceTrail = [];
            const touch = e.touches[0];
            handleMove(touch.clientX, touch.clientY);
        });

        canvas.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            handleMove(touch.clientX, touch.clientY);
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchend', () => {
            isMouseDown = false;
        });
    </script>
</body>
</html>
